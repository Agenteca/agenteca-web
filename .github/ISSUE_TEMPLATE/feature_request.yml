name: Suggest an improvement
description: An idea, or a need that is not covered
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What need do you want to cover?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: standards
    attributes:
      label: Existing standard
      description: Does a standard (OpenAPM, Agent Skills, MCP...) already cover this need? Agenteca only invents a format as a last resort.
