name: Report a bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the behaviour you observed and the one you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version of agenteca-web
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Operating system, Node or IDE version, target tool (Claude Code, Codex, Copilot, Cursor), language of the messages.
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Remove any secret before pasting.
      render: shell
