name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agenteca-web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Agenteca repositories are linked through an npm workspace, as in development.
      - name: Workspace
        run: |
          echo '{"private": true, "workspaces": ["agenteca-web"]}' > package.json
          npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
        working-directory: agenteca-web
      - name: Tests (builds the site)
        run: npm test
        working-directory: agenteca-web
      - name: Types
        run: npm run typecheck
        working-directory: agenteca-web
